name: Markdown links

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests==2.32.3
      - run: python check-markdown-links.py --offline --verbose

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check links
        id: checker
        shell: bash
        run: |
          set +e
          (pip install -q requests==2.32.3 && python check-markdown-links.py --verbose) &> link-check-output.txt
          status=$?
          set -e
          cat link-check-output.txt
          if [ "$status" -eq 0 ]; then
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update link checker issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo -e 'Output from link checker:\n\n```' > issue-body.txt
          grep -v ': ok$' link-check-output.txt >> issue-body.txt || true
          echo '```' >> issue-body.txt
          issue_title="Markdown link checker failures"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "in:title \"$issue_title\"" --limit 100 --json number,title,state |
            jq -c --arg title "$issue_title" '[.[] | select(.title == $title)][0] // empty')

          if [ -n "$issue" ]; then
            issue_number=$(jq -r .number <<< "$issue")
            issue_state=$(jq -r .state <<< "$issue")
            if [ "${{ steps.checker.outputs.has_errors }}" = "true" ] && [ "$issue_state" = "closed" ]; then
              gh issue reopen "$issue_number" --repo "$GITHUB_REPOSITORY"
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file issue-body.txt
            fi
            if [ "${{ steps.checker.outputs.has_errors }}" = "false" ] && [ "$issue_state" = "open" ]; then
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
            fi
          elif [ "${{ steps.checker.outputs.has_errors }}" = "true" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body-file issue-body.txt
          else
            echo "Links are all ok; no existing issue to update."
          fi

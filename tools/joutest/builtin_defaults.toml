# Configuration from this file is always used for every test, unless overridden
# by the user's joutest.toml.
#
# This is in a TOML file mostly so that the default values are also TOML
# objects, and hence don't need to be special-cased as much.
#
# Note: When you develop joutest, please make sure that it's not possible to
# get an error message that points into this file!

stdout = "compare_to_comments"
stderr = "compare_to_comments"
output_comment_rules = {Output = "{comment}"}
output_comment_order = []
skip = false
skip_if_no_expected_output = false
#command = ["jou", "{file}"]  # special-cased because this is different for markdown files and depends on --jou command-line argument
cd_to_containing_directory = false
expected_exit_code = 0
markdown_code_block_languages = ["jou"]

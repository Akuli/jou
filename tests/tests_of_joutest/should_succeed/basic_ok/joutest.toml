[[tests]]
files = "*.jou"

[[tests]]
files = "exit1.jou"
expected_exit_code = 1

[[tests]]
files = "exit69.jou"
expected_exit_code = "any"

[[tests]]
files = "output_comments_disabled.jou"
output_comment_rules = {}

[[tests]]
files = "output_comment_order_2.jou"
output_comment_rules = {Second = "second {comment}", First = "first {comment}"}
output_comment_order = ["First", "Second"]

[[tests]]
files = "output_comment_order_3.jou"
output_comment_order = ["First", "Second", "Third"]  # can be before output_comment_rules
output_comment_rules = {Second = "second {comment}", First = "first {comment}", Third = "third {comment}"}

[[tests]]
files = "hello.jou"
output_comment_order = []  # This is the default value, I just want to check that it can be specified explicitly

[[tests]]
files = {if.any = ["WINDOWS", {not = "WINDOWS"}], then = "hello2.jou", else = "this should not be used.jou"}

[[tests]]
files = {if.all = ["LINUX", {not = "LINUX"}], then = "this should not be used.jou", else = "hello3.jou"}

[[tests]]
files = "transforms.jou"
expected_output_transforms = [
    # The order matters here.
    {replace = "Halloo!!!", with = "Hello"},
    {replace = "!", with = "Hello"},
]

